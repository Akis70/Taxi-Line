       function applyAutomaticTheme() {
    const hour = new Date().getHours();
    const isNight = hour >= 20 || hour < 7; // Παραμένει στις 20:00 όπως ζήτησες
    const body = document.body;

    if (isNight) {
        body.classList.add('dark-mode');
        setMapStyle('night');
        console.log("Automatic Theme: Night Mode Activated");
    } else {
        body.classList.remove('dark-mode');
        setMapStyle('day');
        console.log("Automatic Theme: Day Mode Activated");
    }
}

// Συνάρτηση για την αλλαγή του στυλ του χάρτη
       function setMapStyle(mode) {
    if (!map) return;

    // Αφαιρούμε το παλιό layer αν υπάρχει
    if (window.mapLayer) {
        map.removeLayer(window.mapLayer);
    }

    if (mode === 'night') {
        // Χρησιμοποιούμε τα Dark Matter tiles από την CartoDB (πολύ ξεκούραστα)
        window.mapLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);
    } else {
        // Τα κλασικά Standard tiles
        window.mapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
    }
}

notificationSound.loop = false; 

// Ήχος Άφιξης (για το "Έφτασα")

arrivalSound.loop = false;

function unlockAudio() {
    console.log("Ξεκλείδωμα ήχων...");

    const sounds = [incomingCallSound, notificationSound, arrivalSound];

    sounds.forEach(sound => {
        sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
        }).catch(e => console.log("Sound unlock wait for user interaction..."));
    });
}

        function initMap() {
    // Αρχικοποίηση χάρτη
    map = L.map('map').setView([40.5215, 21.2634], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Συνεχής παρακολούθηση θέσης
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude } = pos.coords;
        window.currentLat = latitude; 
        window.currentLng = longitude;

        // Ενημέρωση του Marker του οδηγού στον χάρτη του
        if (!userMarker) {
            userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("Εσείς");
            map.setView([latitude, longitude], 15);
        } else { 
            userMarker.setLatLng([latitude, longitude]); 
        }

        // Ενημέρωση Βάσης Δεδομένων για τον Οδηγό
        if (isOnline && auth.currentUser && myData.role === 'driver') {
            database.ref('active_drivers/' + auth.currentUser.uid).update({
                lat: latitude,
                lng: longitude,
                timestamp: Date.now()
            }).catch(err => console.error("Σφάλμα ενημέρωσης τοποθεσίας:", err));
        }

        // ΣΗΜΕΙΩΣΗ: Το fitBounds και το database.ref('calls') ΑΦΑΙΡΕΘΗΚΑΝ 
        // για καλύτερη απόδοση και για να μην κολλάει ο χάρτης.

    }, (err) => {
        console.warn("GPS Watch Error (" + err.code + "): " + err.message);
    }, { 
        enableHighAccuracy: true, 
        maximumAge: 0, 
        timeout: 10000 
    });

    if (myData.role === 'passenger') watchDrivers();
}
        
        // --- DRIVER LOGIC ---
        function toggleWorkStatus() {
    const uid = auth.currentUser.uid;
    const btn = document.getElementById('work-btn'); // Το κουμπί σου

    if (!isOnline) {
        // --- ΝΕΟ: Οπτική ένδειξη αναμονής ---
        const originalText = btn.innerText;
        btn.innerText = "⏳ ΑΝΑΖΗΤΗΣΗ GPS...";
        btn.disabled = true; // Απενεργοποίηση για να μην ξαναπατηθεί
        btn.style.opacity = "0.7";

        if (myData.role === 'driver' && myData.status !== 'approved') {
            alert("Ο λογαριασμός σας εκκρεμεί έγκριση.");
            btn.innerText = originalText;
            btn.disabled = false;
            btn.style.opacity = "1";
            return;
        }

        // Καλούμε τη goOnline
        goOnline(); 
        
        // Σημείωση: Μέσα στη goOnline, όταν τελειώσει, 
        // η updateDriverUI(true) θα επαναφέρει το κουμπί στο σωστό χρώμα/κείμενο.
        
        watchPriority(uid);
    } else { 
        goOffline(); 
    }
}
        
function updateDriverUI(online) {
    const btn = document.getElementById('work-btn');
    const badge = document.getElementById('driver-status-badge');
    const prio = document.getElementById('priority-ui');

    if (btn) {
        btn.innerText = online ? "🛑 GO OFFLINE" : "🚀 ΕΝΑΡΞΗ ΒΑΡΔΙΑΣ";
        btn.className = online ? "btn btn-red" : "btn btn-yellow";
    }
    if (badge) {
        badge.innerText = online ? "ONLINE" : "OFFLINE";
        badge.style.background = online ? "#2ecc71" : "#e74c3c";
    }
    if (prio) {
        prio.style.display = online ? "block" : "none";
    }
}

function goOnline() {
    if (!auth.currentUser) return;

    // Εμφάνιση μηνύματος αναμονής αν θέλεις (προαιρετικό)
    console.log("Αναζήτηση τοποθεσίας GPS...");

    // Ζητάμε φρέσκια τοποθεσία ΠΡΙΝ γίνουμε online
    navigator.geolocation.getCurrentPosition(
        (position) => {
            // Ενημερώνουμε τις μεταβλητές με τις ολόφρεσκες συντεταγμένες
            window.currentLat = position.coords.latitude;
            window.currentLng = position.coords.longitude;

            isOnline = true;
            const uid = auth.currentUser.uid;
            const driverRef = database.ref('active_drivers/' + uid);

            // Δίχτυ ασφαλείας για απότομη αποσύνδεση
            driverRef.onDisconnect().remove();

            // Ξεκλείδωμα ήχου
            unlockAudio();

            // Τώρα στέλνουμε τα δεδομένα στη βάση με σιγουριά
            driverRef.set({
                taxiNumber: myData.taxiNumber,
                status: 'online',
                lat: window.currentLat,
                lng: window.currentLng,
                timestamp: Date.now()
            }).then(() => {
                console.log("Ο οδηγός είναι πλέον ONLINE με φρέσκο GPS");
                updateDriverUI(true);
            });
        },
        (error) => {
            console.error("GPS Error:", error);
            alert("Δεν εντοπίστηκε η θέση σου στο GPS. Βεβαιώσου ότι είναι ενεργοποιημένο και δοκίμασε ξανά.");
        },
        { enableHighAccuracy: true, timeout: 10000 } // Ρυθμίσεις για ακρίβεια και χρόνο αναμονής 10δευτ.
    );
}

function goOffline() {
    if (!auth.currentUser) return;
    const uid = auth.currentUser.uid;

    console.log("Αποσύνδεση οδηγού...");

    // 1. Σταματάμε ΑΜΕΣΩΣ το GPS για να μην ξαναγράψει στη βάση
    if (window.locationUpdateInterval) {
        clearInterval(window.locationUpdateInterval);
        window.locationUpdateInterval = null;
    }

    // 2. Ακυρώνουμε τυχόν onDisconnect για να μην μπερδευτεί η Firebase
    database.ref('active_drivers/' + uid).onDisconnect().cancel();

    // 3. Διαγραφή από τους ενεργούς οδηγούς
    database.ref('active_drivers/' + uid).remove()
        .then(() => {
            console.log("Ο οδηγός είναι πλέον Offline");
            isOnline = false;
            updateDriverUI(false);
            
            // Προαιρετικό: Reload για πλήρη καθαρισμό μνήμης
            window.location.reload(); 
        })
        .catch(error => {
            console.error("Σφάλμα κατά την αποσύνδεση:", error);
            // Ακόμα και με σφάλμα, κάνουμε reload για να "ξεκολλήσει" το UI
            window.location.reload();
        });
}

        function listenForCalls() {
    database.ref('calls').on('value', snap => {
        const calls = snap.val();
        for (let id in calls) {
            const c = calls[id];
            if (c.targetDriverId === auth.currentUser.uid) {
                if (c.status === 'pending') {
                    currentCallId = id;
                    document.getElementById('call-details').innerHTML = `👥 Επιβάτες: ${c.passengers}<br>🧳 Αποσκευές: ${c.luggage}`;
                    document.getElementById('incoming-call-overlay').style.display = 'flex';
                    
                    // ΕΝΑΡΞΗ ΣΥΝΕΧΟΜΕΝΟΥ ΗΧΟΥ
                    incomingCallSound.play().catch(e => console.log("Sound blocked, needs interaction"));
                }
                if (id === currentCallId && c.status === 'boarded') showTripStartedUI();
            }
        }
    });
}

window.acceptCall = () => {
    // Σταμάτημα του ήχου κλήσης στον οδηγό
    incomingCallSound.pause();
    incomingCallSound.currentTime = 0;
    
    const eta = prompt("Σε πόσα λεπτά θα είστε εκεί;", "10");
    if (!eta) return;

    const uid = auth.currentUser.uid;
    // Ο οδηγός βγαίνει από τη λίστα διαθέσιμων
    database.ref('active_drivers/' + uid).remove();
    
    const priorityUI = document.getElementById('priority-ui');
    if (priorityUI) priorityUI.style.display = 'none';

    const badge = document.getElementById('driver-status-badge');
    if(badge) {
        badge.innerText = "BUSY (ΣΕ ΔΙΑΔΡΟΜΗ)";
        badge.style.background = "#e67e22";
    }

    isOnline = true; 

    // 1. Ενημέρωση της κλήσης σε 'accepted'
    database.ref('calls/' + currentCallId).update({ 
        status: 'accepted', 
        eta: eta, 
        taxiNumber: myData.taxiNumber,
        driverName: myData.name,
        driverPhone: myData.phone, 
        drLat: window.currentLat, 
        drLng: window.currentLng 
    });

    // Λήψη στοιχείων επιβάτη
    database.ref('calls/' + currentCallId).once('value', snap => {
        const cData = snap.val();
        if (cData) {
            window.activeCustomerLat = cData.lat;
            window.activeCustomerLng = cData.lng;
            
            if (cData.passengerPhone) {
                const wrapper = document.getElementById('call-action-wrapper');
                const link = document.getElementById('phone-call-link');
                link.href = "tel:" + cData.passengerPhone;
                link.innerHTML = "📞 Κλήση Επιβάτη";
                wrapper.style.display = 'block';
            }
        }
    });
    
    const overlay = document.getElementById('incoming-call-overlay');
    if (overlay) overlay.style.display = 'none';

    const tripUi = document.getElementById('trip-ui');
    if (tripUi) tripUi.style.display = 'block';

    const navBtn = document.getElementById('nav-btn-wrapper');
    if (navBtn) navBtn.style.display = 'block';

    setTimeout(() => { if(map) map.invalidateSize(); }, 300);
    
    // 2. Ο Listener που παρακολουθεί τη διαδρομή και τον ήχο ΑΦΙΞΗΣ
    database.ref('calls/' + currentCallId).on('value', s => {
        const data = s.val();
        if (!data) return;

        // --- ΚΡΙΣΙΜΟ: ΕΔΩ ΕΙΝΑΙ Ο ΗΧΟΣ ΓΙΑ ΤΟΝ ΕΠΙΒΑΤΗ ---
        if (data.status === 'arrived' && !window.arrivedSoundPlayed) {
            if (typeof arrivalSound !== 'undefined') {
                arrivalSound.play().then(() => {
                    window.arrivedSoundPlayed = true;
                }).catch(e => console.log("Audio play blocked by browser"));
            }
        }

        // Σχεδιασμός διαδρομής και markers
        if (data.status === 'accepted' || data.status === 'arrived') {
            drawRoute([window.currentLat, window.currentLng], [data.lat, data.lng]);
            
            if (!paxMarker) {
                paxMarker = L.marker([data.lat, data.lng]).addTo(map).bindPopup("Επιβάτης");
            }
            
            const taxiIcon = L.divIcon({ 
                html: `<div class="custom-taxi-icon"><span class="taxi-plate-label">${myData.taxiNumber}</span><span class="taxi-emoji">🚕</span></div>`, 
                className: '' 
            });

            if (!driverTripMarker) {
                driverTripMarker = L.marker([window.currentLat, window.currentLng], { icon: taxiIcon }).addTo(map);
            } else {
                driverTripMarker.setLatLng([window.currentLat, window.currentLng]);
            }
        }
    });

    const actions = document.getElementById('driver-actions');
    if (actions) {
        actions.innerHTML = `<button class="btn btn-yellow" onclick="driverArrived()">🔔 ΕΦΤΑΣΑ</button>`;
    }
};
        
        function rejectCall() {
    // ΣΤΑΜΑΤΗΜΑ ΗΧΟΥ
    incomingCallSound.pause();
    incomingCallSound.currentTime = 0;

    document.getElementById('incoming-call-overlay').style.display = 'none';
    currentCallId = null;
    database.ref('calls/' + currentCallId).remove() // αν θες να σβήνει η κλήση
}

        function driverArrived() {
            database.ref('calls/' + currentCallId).update({ status: 'arrived' });
            document.getElementById('driver-actions').innerHTML = `<div class="card">Περιμένετε τον επιβάτη...</div>`;
        }

        function showTripStartedUI() {
            document.getElementById('map').style.display = 'none';
            document.getElementById('driver-actions').innerHTML = `
                <div class="card" style="background:#2c3e50; color:white;">
                    <h3>🚕 Η ΔΙΑΔΡΟΜΗ ΞΕΚΙΝΗΣΕ</h3>
                    <button class="btn btn-yellow" onclick="completeTrip()" style="font-size:20px;">✅ ΟΛΟΚΛΗΡΩΣΗ</button>
                </div>`;
        }

        // --- PASSENGER LOGIC ---
        function watchDrivers() {
    database.ref('active_drivers').on('value', snap => {
        // Αν υπάρχει ενεργή κλήση, καθαρίζουμε τα πάντα εκτός από το ταξί που έρχεται
        if (currentCallId) {
            map.eachLayer(l => { 
                if (l instanceof L.Marker && l !== userMarker && l !== taxiMarker) {
                    map.removeLayer(l); 
                } 
            });
            return; 
        }

        const drivers = snap.val();
        
        // Καθαρισμός για το re-render
        map.eachLayer(l => { 
            if (l instanceof L.Marker && l !== userMarker) map.removeLayer(l); 
        });

        for (let id in drivers) {
            const d = drivers[id];
            if (d.status === 'online') {
                // Χρήση του νέου CSS εικονιδίου (χωρίς κενό)
                const icon = L.divIcon({ 
                    html: `<div class="custom-taxi-icon">
                             <span class="taxi-plate-label">${d.taxiNumber}</span>
                             <span class="taxi-emoji">🚕</span>
                           </div>`, 
                    className: '',
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });

                L.marker([d.lat, d.lng], { icon: icon }).addTo(map).on('click', () => {
                    selectedDriverId = id;
                    document.getElementById('order-popup').style.display = 'flex';
                });
            }
        }
    });
}
        
// Συνάρτηση που παρακολουθεί την εξέλιξη της κλήσης
function watchCurrentCall(callId) {
    database.ref('calls/' + callId).on('value', snap => {
        const call = snap.val();
        if (!call) return;

        // --- ΕΛΕΓΧΟΣ ΓΙΑ ΗΧΟ "ΕΦΤΑΣΑ" ---
        if (call.status === 'arrived' && !window.arrivalSoundPlayed) {
            if (typeof arrivalSound !== 'undefined') {
                arrivalSound.play().catch(e => console.log("Ήχος μπλοκαρίστηκε"));
                alert("Ο οδηγός έφτασε στο σημείο επιβίβασης!");
                window.arrivalSoundPlayed = true; // Για να μην παίζει συνέχεια σε κάθε update
            }
        }

        // --- ΑΥΤΟΜΑΤΟ ΖΟΥΜΑΡΙΣΜΑ (Προαιρετικό) ---
        // Το κάνουμε μόνο αν ο οδηγός είναι καθ' οδόν (accepted)
        if (call.status === 'accepted' && call.drLat && call.drLng) {
            const bounds = L.latLngBounds([
                [call.drLat, call.drLng], 
                [call.lat, call.lng]
            ]);
            // Χρησιμοποιούμε το { animate: true } για πιο ομαλή κίνηση
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
        }
    });
}
        
        function completeTrip() {
    if (!currentCallId) return;

    // Απενεργοποίηση του listener για να μην έχουμε διπλές ειδοποιήσεις
    database.ref('calls/' + currentCallId).off();

    window.acceptedSoundPlayed = false;
    window.arrivedSoundPlayed = false;

    // Διαγραφή της κλήσης
    database.ref('calls/' + currentCallId).remove()
    .then(() => {
        console.log("Η διαδρομή ολοκληρώθηκε και διαγράφηκε");

        // ΤΟ ΚΛΕΙΔΙ: Μηδενίζουμε το ID της κλήσης
        currentCallId = null; 

        // Επαναφορά οδηγού σε Online
        goOnline(); 
        
        alert("Η διαδρομή ολοκληρώθηκε!");
        
        // Reload για να επανέλθει το αρχικό UI
        setTimeout(() => { location.reload(); }, 800);
    })
    .catch(err => {
        console.error("Σφάλμα:", err);
        location.reload();
    });
}
        
window.confirmOrder = function() {
    // --- ΞΕΚΛΕΙΔΩΜΑ ΗΧΩΝ ---
    // Πρέπει να γίνει ΠΡΙΝ από οτιδήποτε άλλο λόγω των κανόνων των browsers
    if (typeof unlockAudio === "function") {
        unlockAudio();
    }

    // 1. Έλεγχος αν υπάρχουν δεδομένα χρήστη (myData)
    if (!myData) {
        alert("Σφάλμα: Τα στοιχεία σας δεν έχουν φορτωθεί ακόμα.");
        return;
    }

    // Έλεγχος αν έχουμε τοποθεσία
    if (!window.currentLat || !window.currentLng) {
        alert("Παρακαλώ περιμένετε να εντοπιστεί η τοποθεσία σας στον χάρτη.");
        return;
    }

    const pCount = document.getElementById('pax-count').value;
    const lug = document.getElementById('luggage-check').checked ? "ΝΑΙ" : "ΟΧΙ";
    
    // 2. Δημιουργία αναφοράς για τη νέα κλήση
    const newCallRef = database.ref('calls').push();
    currentCallId = newCallRef.key; 

    // 3. Αποθήκευση στη βάση
    newCallRef.set({
        passengerId: auth.currentUser.uid, 
        passengerName: myData.name || "Επιβάτης", 
        passengerPhone: myData.phone || "",
        targetDriverId: selectedDriverId, 
        status: 'pending',
        passengers: pCount, 
        luggage: lug, 
        lat: window.currentLat, 
        lng: window.currentLng, 
        timestamp: Date.now()
    }).then(() => {
        console.log("Η κλήση καταχωρήθηκε επιτυχώς και οι ήχοι ξεκλειδώθηκαν!");
        // Επαναφορά του flag για τον ήχο άφιξης σε κάθε νέα κλήση
        window.arrivedSoundPlayed = false;
    }).catch((error) => {
        console.error("Σφάλμα κατά την κλήση:", error);
    });

    // 4. Κλείσιμο του popup
    document.getElementById('order-popup').style.display = 'none';
};
        
function listenForResponse() {
    database.ref('calls').orderByChild('passengerId').equalTo(auth.currentUser.uid).on('value', snap => {
        const calls = snap.val();
        const sBox = document.getElementById('status-box');
        const centerBtn = document.getElementById('call-center-btn');
        const callWrapper = document.getElementById('call-action-wrapper');

        if (!calls) { 
            currentCallId = null; 
            window.acceptedSoundPlayed = false;
            window.arrivedSoundPlayed = false;
            if (taxiMarker) { map.removeLayer(taxiMarker); taxiMarker = null; }
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            if (sBox) sBox.style.display = 'none'; 
            if (centerBtn) centerBtn.style.display = 'block'; 
            if (callWrapper) callWrapper.style.display = 'none'; // Κλείσιμο κλήσης
            return; 
        }
        
        let hasActiveCall = false;

        for (let id in calls) {
            const c = calls[id]; // Αυτό είναι το "data" σου
            
            if (c.status === 'completed') { 
                if (id === currentCallId) currentCallId = null; 
                if (callWrapper) callWrapper.style.display = 'none';
                continue; 
            }

            hasActiveCall = true;
            currentCallId = id;
            if (sBox) sBox.style.display = 'block';

            if (c.status === 'pending') {
                sBox.style.background = '#7f8c8d';
                sBox.innerHTML = `<h3>⏳ Αναμονή για αποδοχή...</h3>`;
                if (callWrapper) callWrapper.style.display = 'none';
            } 
            else if (c.status === 'accepted' || c.status === 'arrived') {
                sBox.style.background = c.status === 'accepted' ? '#27ae60' : '#3498db';
                
                // ΕΜΦΑΝΙΣΗ ΚΟΥΜΠΙΟΥ ΚΛΗΣΗΣ ΓΙΑ ΕΠΙΒΑΤΗ
                if (c.driverPhone && callWrapper) {
                    const link = document.getElementById('phone-call-link');
                    link.href = "tel:" + c.driverPhone;
                    link.innerHTML = "📞 Κλήση Οδηγού (" + (c.driverName || "") + ")";
                    callWrapper.style.display = 'block';
                }

                if (c.status === 'accepted' && !window.acceptedSoundPlayed) {
                    notificationSound.play();
                    window.acceptedSoundPlayed = true;
                }

                if (c.status === 'arrived') {
                    sBox.innerHTML = `<h3>📍 ΤΟ ΤΑΞΙ ΕΦΤΑΣΕ!</h3><button class="btn btn-yellow" onclick="boardTrip('${id}')">ΕΠΙΒΙΒΑΖΟΜΑΙ</button>`;
                } else {
                    sBox.innerHTML = `<h3>✅ Έρχεται το ${c.taxiNumber}</h3><p>Σε ${c.eta} λεπτά.</p>`;
                }
                 
                if (c.drLat && c.drLng) {
                    const taxiPos = [c.drLat, c.drLng];
                    const taxiIcon = L.divIcon({ 
                        html: `<div class="custom-taxi-icon"><span class="taxi-plate-label">${c.taxiNumber}</span><span class="taxi-emoji">🚕</span></div>`, 
                        className: ''
                    });
                    if (!taxiMarker) { taxiMarker = L.marker(taxiPos, { icon: taxiIcon }).addTo(map); } 
                    else { taxiMarker.setLatLng(taxiPos); }
                    if (c.status === 'accepted') { drawRoute([window.currentLat, window.currentLng], taxiPos); }
                }
            } 
            else if (c.status === 'boarded') {
                sBox.style.background = '#2c3e50';
                sBox.innerHTML = `<h3>🚕 Καλή διαδρομή!</h3>`;
                if (callWrapper) callWrapper.style.display = 'none';
            }
        }
        if (centerBtn) centerBtn.style.display = hasActiveCall ? 'none' : 'block';
    });
}
        
        function boardTrip(id) { database.ref('calls/' + id).update({ status: 'boarded' }); }

        function drawRoute(start, end) {
            if (!start || !end || !start[0] || !end[0]) return;
            if (routeLine) map.removeLayer(routeLine);
            fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`)
            .then(r => r.json()).then(data => {
                if (data.routes && data.routes[0]) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    routeLine = L.polyline(coords, { color: '#f1c40f', weight: 6 }).addTo(map);
                }
            }).catch(err => console.error("OSRM Error:", err));
        }

        function watchPriority(uid) {
    database.ref('active_drivers').on('value', snap => {
        const listDiv = document.getElementById('priority-list');
        if (!listDiv) return;
        
        const drivers = snap.val();
        if (!drivers) {
            listDiv.innerHTML = "Κανένας οδηγός διαθέσιμος";
            return;
        }

        let sorted = Object.keys(drivers)
            .map(id => ({id, ...drivers[id]}))
            // ΦΙΛΤΡΟ: Πρέπει να έχει status online ΚΑΙ έγκυρο taxiNumber
            .filter(d => d.status === 'online' && d.taxiNumber !== undefined && d.taxiNumber !== null)
            .sort((a,b) => a.timestamp - b.timestamp);
            
        // Μέσα στη watchPriority, άλλαξε το listDiv.innerHTML:
            listDiv.innerHTML = sorted.map((d, i) => `
    <div style="padding:10px; border-bottom:1px solid #eee; color: #000 !important; ${d.id === uid ? 'background:#fff9c4; font-weight:bold;' : 'background:#fff;'}">
        ${i+1}. Ταξί ${d.taxiNumber}
    </div>
`).join("") || "<div style='color:#000;'>Κανένας οδηγός διαθέσιμος</div>";
    });
}

function cleanOldCalls() {
    const tenMinutesAgo = Date.now() - (10 * 60 * 1000);
    database.ref('calls').once('value', snap => {
        const calls = snap.val();
        if (!calls) return; // Προσθήκη ασφαλείας αν δεν υπάρχουν κλήσεις
        for (let id in calls) {
            // Αν η κλήση είναι παλαιότερη από 10 λεπτά, διέγραψέ την
            if (calls[id].timestamp < tenMinutesAgo) {
                database.ref('calls/' + id).remove();
            }
        }
    });
}

        let confirmationResult; // Εδώ αποθηκεύεται το αποτέλεσμα της Firebase για το SMS

// Αρχικοποίηση του Recaptcha
window.onload = function() {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible' // 'invisible' για να μην ενοχλεί, ή 'normal' για να φαίνεται
    });
};

function checkPhoneVerification(user) {
    const overlay = document.getElementById('phone-verification-overlay');
    
    // ΑΣΦΑΛΕΙΑ: Αν το στοιχείο δεν υπάρχει στο HTML, σταμάτα εδώ χωρίς σφάλμα
    if (!overlay) return; 

    if (myData && myData.phoneVerified) {
        overlay.style.setProperty('display', 'none', 'important');
        overlay.style.pointerEvents = 'none';
        return;
    }
    
    // Αν δεν είναι verified, τότε μόνο το δείχνουμε
    overlay.style.display = 'flex';
    overlay.style.pointerEvents = 'all';
}
function sendVerificationCode() {
    // 1. Λήψη του αριθμού
    let rawNumber = document.getElementById('verify-phone-number').value.trim();
    rawNumber = rawNumber.replace(/\s+/g, '');

    // 2. Μορφοποίηση
    let targetPhone = rawNumber;
    if (rawNumber.length === 10 && rawNumber.startsWith('6')) {
        targetPhone = '+30' + rawNumber;
    } else if (!rawNumber.startsWith('+')) {
        alert("Παρακαλώ εισάγετε έναν έγκυρο 10ψήφιο αριθμό.");
        return;
    }

    // 3. Recaptcha
    const appVerifier = window.recaptchaVerifier;

    // 4. Αποστολή
    auth.currentUser.linkWithPhoneNumber(targetPhone, appVerifier)
        .then(function(result) {
            confirmationResult = result;
            document.getElementById('phone-input-section').style.display = 'none';
            document.getElementById('code-input-section').style.display = 'block';
            alert("Ο κωδικός στάλθηκε στο " + targetPhone);
        })
        .catch(function(error) {
            console.error("SMS Error:", error);
            if (error.code === 'auth/quota-exceeded') {
                alert("Το ημερήσιο όριο SMS εξαντλήθηκε.");
            } else {
                alert("Σφάλμα: " + error.message);
            }
        });
}

function verifySMSCode() {
    const code = document.getElementById('verification-code').value;
    if (!code) {
        alert("Παρακαλώ εισάγετε τον κωδικό.");
        return;
    }
    
    confirmationResult.confirm(code).then(function(result) {
        alert("Το τηλέφωνο επιβεβαιώθηκε με επιτυχία!");
        location.reload(); 
    }).catch(function(error) {
        console.error("Verify Error:", error);
        alert("Λάθος κωδικός ή ληγμένος. Δοκιμάστε ξανά.");
    });
}

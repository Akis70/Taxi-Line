<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi-Line | Welcome</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <script>
    var klaroConfig = {
        elementID: 'klaro',
        cookieName: 'taxi_line_consent',
        cookieExpiresAfterDays: 365,
        privacyPolicy: 'privacy.html', // Σύνδεσμος με την Πολιτική Απορρήτου
        default: false,
        mustConsent: true, // Εμποδίζει τη χρήση της σελίδας μέχρι να επιλέξει ο χρήστης
        acceptAll: true,
        hideDeclineAll: false,
        hideLearnMore: false,

        translations: {
            el: {
                consentModal: {
                    title: '🛡️ Προστασία Δεδομένων & Cookies',
                    description: 'Στο Taxi-Line σεβόμαστε απόλυτα τα δεδομένα σας. Επιλέξτε ποια cookies και δεδομένα επιτρέπετε να επεξεργαστούμε. Τα στοιχεία λογαριασμού σας (Email, Τηλέφωνο) συλλέγονται αποκλειστικά για την εκτέλεση της υπηρεσίας.',
                },
                consentNotice: {
                    description: 'Χρησιμοποιούμε cookies για την ομαλή λειτουργία της σελίδας και συλλέγουμε δεδομένα τοποθεσίας για την εύρεση ταξί σε πραγματικό χρόνο.',
                    learnMore: 'Ρυθμίσεις / Περισσότερα',
                    acceptAll: 'Αποδοχή Όλων',
                    acceptSelected: 'Αποδοχή Επιλεγμένων',
                    decline: 'Μόνο τα Απαραίτητα',
                },
                purposes: {
                    essential: 'Απαραίτητα (Λογαριασμός & Σύνδεση)',
                    location: 'Τοποθεσία σε Πραγματικό Χρόνο',
                    analytics: 'Στατιστικά (Analytics)',
                },
            },
            en: {
                consentModal: {
                    title: '🛡️ Data Protection & Cookies',
                    description: 'At Taxi-Line we fully respect your data. Choose which cookies and data you allow us to process. Your account details (Email, Phone) are collected strictly for the performance of the service.',
                },
                consentNotice: {
                    description: 'We use cookies to ensure the best experience and collect location data for real-time ride-matching.',
                    learnMore: 'Settings / More',
                    acceptAll: 'Accept All',
                    acceptSelected: 'Accept Selected',
                    decline: 'Strictly Necessary',
                },
                purposes: {
                    essential: 'Necessary (Account & Login)',
                    location: 'Real-time Location',
                    analytics: 'Analytics',
                },
            },
        },

        services: [
            {
                name: 'essential',
                title: 'Βασικά Cookies & Στοιχεία',
                purposes: ['essential'],
                required: true, // Υποχρεωτικό, δεν απενεργοποιείται
                description: 'Απαραίτητα για τη σύνδεση (Firebase Auth), τη διατήρηση του session, το Email και το Τηλέφωνό σας. Χωρίς αυτά η εφαρμογή δεν μπορεί να λειτουργήσει.',
            },
            {
                name: 'geolocation',
                title: 'Υπηρεσίες Τοποθεσίας (GPS)',
                purposes: ['location'],
                default: false, // Απενεργοποιημένο από προεπιλογή
                description: 'Επιτρέπει στην εφαρμογή να εντοπίζει τη θέση σας στον χάρτη για να σας συνδέει με τον κοντινότερο οδηγό ταξί.',
            },
            {
                name: 'google-analytics',
                title: 'Google Analytics',
                purposes: ['analytics'],
                default: false, // Απενεργοποιημένο από προεπιλογή
                description: 'Μας βοηθά να κατανοήσουμε ανώνυμα πώς χρησιμοποιείτε τη σελίδα για να τη βελτιώσουμε.',
            }
        ],
    };
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/klaro@0.7.11/dist/klaro.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/klaro@0.7.11/dist/klaro-no-css.js"></script>

    <style>
        :root {
            --primary: #f1c40f;
            --bg: #fdf9d8;
            --card-bg: white;
            --text: #2c3e50;
        }

        /* Night Mode Styles */
        body.dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            transition: background 0.3s ease;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px;
            margin-bottom: 60px; /* Χώρος για το footer */
        }

        h1 { color: var(--text); margin: 0; font-size: 32px; }

        .motto { font-style: italic; color: #777; margin-bottom: 30px; line-height: 1.4; }
        body.dark-mode .motto { color: #aaa; }

        .auth-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        body.dark-mode .auth-box { border-color: #333; }

        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            background: white;
            color: black;
        }
        body.dark-mode input, body.dark-mode select {
            background: #2c2c2c;
            border-color: #444;
            color: white;
        }

        .btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }

        .btn-quick { background: #2ecc71; color: white; margin-top: 10px; }

        .toggle-link { display: block; margin-top: 20px; color: #3498db; cursor: pointer; font-size: 15px; }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle { font-size: 24px; cursor: pointer; background: none; border: none; }

        .lang-switch img { width: 30px; cursor: pointer; border-radius: 5px; }

        .g-recaptcha { display: flex; justify-content: center; margin: 15px 0; }

        #register-form { display: none; }

        /* GDPR Checkbox Styling */
        .gdpr-checkbox-container {
            display: flex;
            align-items: flex-start;
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.4;
        }
        .gdpr-checkbox-container input {
            width: auto;
            margin: 4px 10px 0 0;
            cursor: pointer;
        }
        .gdpr-checkbox-container a {
            color: #3498db;
            text-decoration: none;
        }
        .gdpr-checkbox-container a:hover {
            text-decoration: underline;
        }

        /* Footer Fixed Bottom */
        .app-footer {
            margin-top: 30px;
            font-size: 13px;
            color: #7f8c8d;
        }
        .app-footer a {
            color: #7f8c8d;
            text-decoration: none;
            margin: 0 10px;
        }
        .app-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <div class="lang-switch">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Greece.svg" onclick="setLang('el')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg" onclick="setLang('en')">
        </div>
    </div>

    <div class="container">
        <span style="font-size:60px;">🚕</span>
        <h1>Taxi-Line</h1>
        <p class="motto" id="txt-motto"></p>

        <div class="auth-box">
            <div id="login-form">
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-pass" placeholder="Password">
                <button class="btn" onclick="handleLogin()" id="btn-login-label"></button>
                <span class="toggle-link" onclick="showForm('reg')" id="link-to-reg"></span>
            </div>

            <div id="register-form">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="password" id="reg-pass" placeholder="Password (6+ chars)">
                
                <input type="text" id="reg-name" placeholder="Ονοματεπώνυμο (π.χ. Άννα Παπαδοπούλου)">
                <input type="text" id="reg-phone" placeholder="Τηλέφωνο (π.χ. +3069...)">

                <select id="reg-role" onchange="toggleDriverFields(this.value)">
                    <option value="passenger">Επιβάτης / Passenger</option>
                    <option value="driver">Οδηγός Ταξί / Driver</option>
                </select>

                <div id="driver-extra-fields" style="display:none;">
                    <input type="text" id="reg-plate" placeholder="Αριθμός Πινακίδας">
                    <input type="text" id="reg-taxi-num" placeholder="Αριθμός Ταξί (π.χ. 28)">
                    <input type="text" id="reg-license" placeholder="Αριθμός Αδείας ΕΔΧ">
                </div>

                <div class="gdpr-checkbox-container">
                    <input type="checkbox" id="reg-gdpr-check">
                    <label for="reg-gdpr-check" id="lbl-gdpr-reg"></label>
                </div>

                <div class="g-recaptcha" data-sitekey="6LfY_4IsAAAAAMRRNMSZPHD_Q3wB59JKd3y6xFJh"></div>
                <button class="btn" onclick="handleSignup()" id="btn-reg-label"></button>
                <span class="toggle-link" onclick="showForm('login')" id="link-to-login"></span>
            </div>
        </div>

        <button class="btn btn-quick" onclick="window.location.href='tel:6999222446'" id="btn-quick-label" style="cursor: pointer;"></button>

        <p style="margin-top:40px;color:#7f8c8d;font-size:14px;" id="txt-support"></p>
        <p style="font-weight:bold;">
            Email: akisss70@gmail.com<br>
            📞 +30 6999222446
        </p>

        <footer class="app-footer">
            <p>
                <a href="terms.html" id="link-footer-terms"></a> | 
                <a href="privacy.html" id="link-footer-privacy"></a>
            </p>
            <p>© 2026 Taxi-Line. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig={
            apiKey:"AIzaSyCCzXoeqv3VODlSH6j3HrqI36ixYYdEjjI",
            authDomain:"taxi-line-f149e.firebaseapp.com",
            databaseURL:"https://taxi-line-f149e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId:"taxi-line-f149e",
            storageBucket:"taxi-line-f149e.firebasestorage.app",
            messagingSenderId:"1086896421565",
            appId:"1:1086896421565:web:e498b8916fd95a04e7d5d4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth=firebase.auth();
        const database=firebase.database();

        let lang=localStorage.getItem('lang')||'el';

        const translations={
            el:{
                motto:"Μια ανοιχτή κοινότητα επικοινωνίας μεταξύ επιβατών και επαγγελματιών οδηγών - συνδέουμε επιβάτες και οδηγούς γρήγορα και εύκολα",
                login:"ΣΥΝΔΕΣΗ",
                toReg:"Δεν έχετε λογαριασμό; Εγγραφή",
                toLogin:"Έχετε ήδη λογαριασμό; Σύνδεση",
                quick:"📞 ΚΑΛΕΣΤΕ ΤΑΞΙ ΧΩΡΙΣ ΕΓΓΡΑΦΗ",
                reg:"ΔΗΜΙΟΥΡΓΙΑ ΛΟΓΑΡΙΑΣΜΟΥ",
                support:"Έχετε ερωτήσεις ή χρειάζεστε υποστήριξη; Επικοινωνήστε μαζί μας!",
                gdprReg: "Δηλώνω ότι αποδέχομαι τους <a href='terms.html' target='_blank'>Όρους Χρήσης</a> και συναινώ στην επεξεργασία του τηλεφώνου και της τοποθεσίας μου σύμφωνα με την <a href='privacy.html' target='_blank'>Πολιτική Απορρήτου</a>.",
                footerTerms:"Όροι Χρήσης",
                footerPrivacy:"Πολιτική Απορρήτου"
            },
            en:{
                motto:"Your friendly taxi service - we connect passengers with drivers quickly and easily",
                login:"LOGIN",
                toReg:"Don't have an account? Sign up here",
                toLogin:"Already have an account? Login",
                quick:"📞 CALL WITHOUT SIGNUP",
                reg:"CREATE ACCOUNT",
                support:"Do you have questions or need support? Contact us!",
                gdprReg: "I declare that I accept the <a href='terms.html' target='_blank'>Terms of Service</a> and consent to the processing of my phone number and location as described in the <a href='privacy.html' target='_blank'>Privacy Policy</a>.",
                footerTerms:"Terms of Service",
                footerPrivacy:"Privacy Policy"
            }
        };

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const mode = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('taxi-theme', mode);
        }

        function toggleDriverFields(role) {
            const extraFields = document.getElementById('driver-extra-fields');
            if (role === 'driver') {
                extraFields.style.display = 'block';
            } else {
                extraFields.style.display = 'none';
            }
        }

        function applyLang(){
            const t=translations[lang];
            document.getElementById('txt-motto').innerText=t.motto;
            document.getElementById('btn-login-label').innerText=t.login;
            document.getElementById('link-to-reg').innerText=t.toReg;
            document.getElementById('btn-reg-label').innerText=t.reg;
            document.getElementById('link-to-login').innerText=t.toLogin;
            document.getElementById('btn-quick-label').innerText=t.quick;
            document.getElementById('txt-support').innerText=t.support;
            
            document.getElementById('lbl-gdpr-reg').innerHTML=t.gdprReg;
            document.getElementById('link-footer-terms').innerText=t.footerTerms;
            document.getElementById('link-footer-privacy').innerText=t.footerPrivacy;

            // 🛡️ Ενημέρωση της γλώσσας στο Klaro δυναμικά αν έχει φορτωθεί
            if (typeof klaro !== 'undefined' && klaro.getManager) {
                klaro.language = lang;
            }
        }

        function setLang(l){
            lang=l;
            localStorage.setItem('lang',l);
            applyLang();
            // Μικρό reload της σελίδας για να εφαρμόσει το Klaro τη νέα γλώσσα άμεσα
            window.location.reload();
        }

        function showForm(type){
            document.getElementById('login-form').style.display=(type==='login'?'block':'none');
            document.getElementById('register-form').style.display=(type==='reg'?'block':'none');
        }

        async function handleSignup() {
            if (typeof grecaptcha === "undefined" || grecaptcha.getResponse().length === 0) {
                alert(lang === 'el' ? "Παρακαλώ επιβεβαιώστε το reCAPTCHA" : "Please verify the reCAPTCHA");
                return;
            }

            // ΕΛΕΓΧΟΣ CHECKBOX GDPR
            const gdprChecked = document.getElementById('reg-gdpr-check').checked;
            if (!gdprChecked) {
                alert(lang === 'el' ? "Πρέπει να αποδεχτείτε τους Όρους Χρήσης και την Πολιτική Απορρήτου για να εγγραφείτε." : "You must accept the Terms of Service and Privacy Policy to register.");
                return;
            }

            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();

            if (email === "" || pass.length < 6 || name === "" || phone === "") {
                alert(lang === 'el' ? "Παρακαλώ συμπληρώστε όλα τα πεδία (Email, Password, Όνομα και Τηλέφωνο)." : "Please fill all fields (Email, Password, Name and Phone).");
                return;
            }

            try {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                
                const userData = {
                    email: email,
                    name: name,
                    phone: phone,
                    role: role,
                    status: (role === 'driver' ? 'pending' : 'approved')
                };

                if (role === 'driver') {
                    userData.plate = document.getElementById('reg-plate').value;
                    userData.taxiNumber = document.getElementById('reg-taxi-num').value;
                    userData.license = document.getElementById('reg-license').value;
                }

                await database.ref('users/' + res.user.uid).set(userData);

                alert(lang === 'el' ? "Η εγγραφή ολοκληρώθηκε επιτυχώς!" : "Registration completed successfully!");
                grecaptcha.reset();
                document.getElementById('reg-gdpr-check').checked = false; // reset το checkbox
                showForm('login');
            } catch (e) { 
                alert(e.message); 
            }
        }

        async function handleLogin(){
            const email=document.getElementById('login-email').value.trim();
            const pass=document.getElementById('login-pass').value;
            if(email===""||pass===""){
                alert(lang === 'el' ? "Συμπληρώστε email και password" : "Please fill in email and password");
                return;
            }
            try{
                await auth.signInWithEmailAndPassword(email,pass);
                window.location.href="dashboard.html";
            }catch(e){ alert(e.message); }
        }

        window.onload = function() {
            applyLang();
            
            // Έλεγχος τρέχουσας ώρας για αυτόματη εναλλαγή (20:00 - 07:00)
            const currentHour = new Date().getHours();
            const isNightTime = currentHour >= 20 || currentHour < 7;
            
            // Προτεραιότητα έχει η χειροκίνητη επιλογή του χρήστη (αν υπάρχει), 
            // αλλιώς εφαρμόζεται η αυτόματη επιλογή βάσει ώρας.
            const savedTheme = localStorage.getItem('taxi-theme');
            
            if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }

            // 🛡️ Ορισμός της αρχικής γλώσσας στο Klaro! κατά το φόρτωμα
            if (typeof klaro !== 'undefined') {
                klaro.language = lang;
            }
        };
    </script>
</body>
</html>
